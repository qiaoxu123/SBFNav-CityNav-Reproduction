name: Import reproduced SBFNav snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'chore: add one-time SBFNav import workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reproduced SBFNav branch
        uses: actions/checkout@v4
        with:
          repository: qiaoxu123/2027-CVPR
          ref: codex/reproduce-sbfnav
          fetch-depth: 1
          persist-credentials: false

      - name: Recreate as standalone repository snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf .git
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import SBFNav CityNav reproduction snapshot from codex/reproduce-sbfnav"
          git branch -M main
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/qiaoxu123/SBFNav-CityNav-Reproduction.git"
          git push --force origin main
